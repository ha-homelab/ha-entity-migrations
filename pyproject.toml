[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-entity-migrations"
version = "0.1.1b1"
description = "Offline, read-only role-aware Home Assistant migration plans"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ha-homelab contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
ha-entity-migrations = "ha_entity_migrations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

